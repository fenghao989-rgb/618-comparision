<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>618比价助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #FF4757, #FF6B81);
      color: #333;
    }
    .header {
      padding: 16px;
      color: white;
      text-align: center;
    }
    .header h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    .content {
      background: white;
      border-radius: 16px 16px 0 0;
      padding: 16px;
      min-height: 300px;
    }
    .platform-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .platform-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 12px;
      transition: all 0.3s;
    }
    .platform-item.active {
      background: linear-gradient(135deg, #fff5f6, #fff);
      border: 2px solid #FF4757;
    }
    .platform-item.empty {
      opacity: 0.5;
    }
    .platform-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .platform-info {
      flex: 1;
    }
    .platform-name {
      font-weight: 600;
      font-size: 14px;
      color: #333;
    }
    .platform-price {
      font-size: 18px;
      font-weight: 700;
      color: #FF4757;
    }
    .platform-price.empty {
      font-size: 12px;
      color: #999;
      font-weight: normal;
    }
    .platform-status {
      font-size: 10px;
      color: #666;
    }
    .actions {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #FF4757, #FF6B81);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    .no-data-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .no-data-text {
      font-size: 14px;
      line-height: 1.6;
    }
    .footer {
      background: white;
      padding: 12px 16px;
      border-radius: 0 0 16px 16px;
      text-align: center;
    }
    .footer a {
      color: #FF4757;
      text-decoration: none;
      font-size: 12px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      transition: transform 0.3s;
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 618 比价助手</h1>
    <p>自动获取各平台商品价格</p>
  </div>

  <div class="content" id="content">
    <div class="no-data" id="noData">
      <div class="no-data-icon">📦</div>
      <div class="no-data-text">
        还没有获取任何商品价格<br>
        请在电商平台商品页面点击扩展图标
      </div>
    </div>

    <div class="platform-list" id="platformList" style="display: none;">
    </div>

    <div class="actions" id="actions" style="display: none;">
      <button class="btn btn-primary" id="openComparison">
        <span>📊</span> 打开比价网页
      </button>
      <button class="btn btn-secondary" id="clearData">
        <span>🗑️</span> 清除数据
      </button>
    </div>
  </div>

  <div class="footer">
    <a href="http://localhost:8080" target="_blank">打开比价网页 →</a>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
